[project]
name = "mini-llm"
version = "0.1.0"
description = "A mini LLM built from scratch, for learning and interviews"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy",
    "matplotlib",
    "tqdm",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false   # plain project, not an installable package

[tool.pytest.ini_options]
pythonpath = ["."]   # so tests can `import mini_llm`
testpaths = ["tests"]
