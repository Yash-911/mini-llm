[project]
name = "mini-llm"
version = "0.1.0"
description = "A mini LLM built from scratch, for learning and interviews"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "numpy",
    "matplotlib",
    "tqdm",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
# Makes `mini_llm` installable; `uv sync` installs it in editable mode,
# so `import mini_llm` works from scripts/, tests/ and notebooks.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_llm"]
